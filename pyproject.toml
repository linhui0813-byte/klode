[build-system]
requires = ["setuptools>=77"]        # >=77 for PEP 639 SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "lode"
version = "0.1.0"
description = "A grounded knowledge system: an engine (lode.lib) and a supervising agent (lode.gate) over a corpus of knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # zero runtime dependencies — stdlib only
keywords = ["knowledge-base", "citations", "grep", "provenance", "supervising-agent", "rag"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
# `lode check --entail` only — the default path stays zero-dependency. Pulls a small NLI/fact-check
# model (MiniCheck-Flan-T5-Large, 770M) behind transformers+torch. Advisory, warn-only.
entail = ["minicheck>=1.1"]

[project.scripts]
lode = "lode.lib.cli:main"
lode-mcp = "lode.lib.mcp_server:main"

[tool.setuptools]
packages = ["lode", "lode.lib", "lode.gate"]
