name: publish

# Publishes klode to PyPI via Trusted Publishing (OIDC — no API token/secret).
# Triggers on a version tag push, or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The release gate. A tag push does not match `tests.yml`'s `branches: ["**"]`, so until this
  # existed a tag published whatever was on it — red suite included. Calling the workflow rather
  # than copying its jobs means the thing gating a release is the same thing gating a branch.
  tests:
    name: Test suite
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # A TAG, and nothing else. `workflow_dispatch` is on this workflow so a release can be re-run
    # by hand, and with no ref guard that meant anyone who can press "Run workflow" could publish
    # an arbitrary branch to PyPI — no token needed, since Trusted Publishing authenticates the
    # workflow rather than the operator. Same class as the missing test gate: the release path was
    # reachable without passing the things that make a release a release.
    # It also makes `workflow_dispatch` a safe way to exercise the gate: tests and build run, and
    # publish skips on any non-tag ref.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
